<meta name="claude:viewport-fit-sides" content="cover">
<title>CareBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky app bar + wrapping tab rail over a single scrolling workspace; cards are modular panels, color carries recovery status. */
:root{
  --bg:#f1f5f3; --surface:#ffffff; --surface-2:#eaf0ee; --surface-3:#e2ebe8;
  --ink:#14241f; --ink-2:#51635d; --ink-3:#7f908a; --line:#dde6e2;
  --primary:#0d8a7a; --primary-deep:#0a5f55; --primary-soft:#d6ebe6;
  --accent:#e26a52; --accent-soft:#fbe4dd;
  --good:#18925f; --good-soft:#d8efe3;
  --warn:#c57c12; --warn-soft:#f8e9cf;
  --crit:#cf4040; --crit-soft:#f8dede;
  --shadow:0 1px 2px rgba(16,40,34,.05),0 8px 24px rgba(16,40,34,.06);
  --shadow-lg:0 12px 40px rgba(16,40,34,.14);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1512; --surface:#111f1a; --surface-2:#172923; --surface-3:#1d332b;
  --ink:#e8efec; --ink-2:#9bafa8; --ink-3:#6f847d; --line:#243730;
  --primary:#34b7a4; --primary-deep:#86e0d2; --primary-soft:#17332d;
  --accent:#f08a72; --accent-soft:#33211c;
  --good:#38bd84; --good-soft:#17312429;
  --warn:#dca64c; --warn-soft:#2c2412;
  --crit:#e46d6d; --crit-soft:#331b1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1512; --surface:#111f1a; --surface-2:#172923; --surface-3:#1d332b;
  --ink:#e8efec; --ink-2:#9bafa8; --ink-3:#6f847d; --line:#243730;
  --primary:#34b7a4; --primary-deep:#86e0d2; --primary-soft:#17332d;
  --accent:#f08a72; --accent-soft:#33211c;
  --good:#38bd84; --good-soft:#153024;
  --warn:#dca64c; --warn-soft:#2c2412;
  --crit:#e46d6d; --crit-soft:#331b1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
a{color:var(--primary-deep)}
button{font-family:inherit}
::selection{background:var(--primary-soft);color:var(--ink)}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;
  padding-block:11px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:4px}
.logo{width:34px;height:34px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  display:grid;place-items:center;box-shadow:var(--shadow)}
.logo svg{width:20px;height:20px}
.brand b{font-family:"Fraunces",serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:-2px}
.appbar-spacer{flex:1}
.pchip{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px 4px 5px;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#c98f6a,#a86a4a);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:12px;font-family:"Public Sans"}
.pchip b{font-weight:600}
.pchip .day{color:var(--primary-deep);font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.persona{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.persona button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;
  padding:5px 12px;border-radius:7px;cursor:pointer}
.persona button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- tab rail ---------- */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:45;background:var(--bg);border-bottom:1px solid var(--line)}
.rail-in{display:flex;gap:4px;max-width:1180px;margin:0 auto;overflow-x:auto;scrollbar-width:none;
  padding-block:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.rail-in::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;
  color:var(--ink-2);font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--primary-deep);border-color:var(--line);box-shadow:var(--shadow)}
.tab .tnum{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:5px;padding:1px 5px}
.tab[aria-selected="true"] .tnum{background:var(--primary-soft);color:var(--primary-deep)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}

/* ---------- workspace ---------- */
.wrap{max-width:1180px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-top:22px;padding-bottom:64px}
.view[hidden]{display:none!important}
.viewhead{margin-bottom:18px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--primary-deep);margin-bottom:9px}
.eyebrow .step{background:var(--primary);color:#fff;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px}
.viewhead h1{font-size:clamp(26px,4.4vw,36px);letter-spacing:-.015em}
.viewhead p{color:var(--ink-2);margin:8px 0 0;max-width:62ch;font-size:15px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:1.6fr 1fr}
.g-1-2{grid-template-columns:1fr 1.7fr}
@media(max-width:820px){.g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.pad-lg{padding:22px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px}
.card-h .ic{width:30px;height:30px;border-radius:8px;background:var(--primary-soft);color:var(--primary-deep);
  display:grid;place-items:center;flex:none}
.card-h .ic svg{width:17px;height:17px}
.card-h .sub{color:var(--ink-3);font-size:12.5px;margin-left:auto;font-weight:500}
.lead{color:var(--ink-2);font-size:14px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .tl{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .tv{font-family:"Fraunces",serif;font-size:30px;font-weight:500;letter-spacing:-.02em;margin-top:6px;line-height:1}
.tile .tv small{font-size:14px;color:var(--ink-3);font-family:"Public Sans";font-weight:600}
.tile .tm{font-size:12px;margin-top:7px;display:flex;align-items:center;gap:5px;color:var(--ink-3)}
.tile .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-crit{color:var(--crit)} .s-prim{color:var(--primary-deep)}
.bg-good{background:var(--good)} .bg-warn{background:var(--warn)} .bg-crit{background:var(--crit)} .bg-prim{background:var(--primary)}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  letter-spacing:.02em;white-space:nowrap}
.pill svg{width:12px;height:12px}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-prim{background:var(--primary-soft);color:var(--primary-deep)}
.p-ink{background:var(--surface-2);color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.prim{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(13,138,122,.28)}
.btn.prim:hover{background:var(--primary-deep);border-color:var(--primary-deep)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.btn.sm{padding:7px 12px;font-size:13px}

/* discharge extraction */
.doc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.7;color:var(--ink-2);
  max-height:300px;overflow:auto;white-space:pre-wrap;tab-size:2}
.doc b{color:var(--ink);font-weight:600}
.filemeta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.filemeta .fi{width:30px;height:30px;border-radius:7px;background:var(--crit-soft);color:var(--crit);display:grid;place-items:center;flex:none}

.extract-out{display:none}
.extract-out.on{display:block;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.proc{display:none;align-items:center;gap:11px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r-sm);
  border:1px dashed var(--line);color:var(--ink-2);font-size:13.5px;font-weight:500}
.proc.on{display:flex}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--primary-soft);border-top-color:var(--primary);
  animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* lists */
.klist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.kitem{display:flex;gap:12px;padding:11px 10px;border-radius:10px;align-items:flex-start}
.kitem:hover{background:var(--surface-2)}
.chk{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line);background:var(--surface);
  cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.5);transition:.15s}
.kitem.done .chk{background:var(--good);border-color:var(--good)}
.kitem.done .chk svg{opacity:1;transform:none}
.kitem.done .ktitle{text-decoration:line-through;color:var(--ink-3)}
.ktitle{font-weight:600;font-size:14px}
.kmeta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ktime{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2);padding:2px 8px;border-radius:6px;white-space:nowrap;margin-left:auto}
.kitem.done .ktime{background:var(--good-soft);color:var(--good)}

.progress{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--good));border-radius:999px;transition:width .4s ease}

/* med table */
table.med{width:100%;border-collapse:collapse;font-size:13.5px}
table.med th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
table.med td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.med tr:last-child td{border-bottom:0}
table.med .m-name{font-weight:600}
.tbl-scroll{overflow-x:auto}

/* chart */
.chartwrap{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{width:14px;height:3px;border-radius:2px}
.lk.dash{background:none;border-top:2px dashed var(--ink-3);height:0}

.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-family:"Fraunces",serif;font-size:27px;font-weight:500;line-height:1}
.ring .rv small{font-size:11px;color:var(--ink-3);font-weight:600}

/* alert / escalation */
.alert{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;border:1px solid}
.alert .ai{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert.crit{background:var(--crit-soft);border-color:#e9b4b4}
.alert.crit .ai{background:var(--crit);color:#fff}
.alert.warn{background:var(--warn-soft);border-color:#e6cf9b}
.alert.warn .ai{background:var(--warn);color:#fff}
.alert h4{font-size:15px;margin-bottom:3px}
.alert p{margin:0;font-size:13.5px;color:var(--ink-2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert.crit{border-color:#5a2b2b}.alert.warn{border-color:#5a4a22}}
:root[data-theme="dark"] .alert.crit{border-color:#5a2b2b}
:root[data-theme="dark"] .alert.warn{border-color:#5a4a22}

/* observation log */
.obs{display:flex;flex-direction:column;gap:0}
.obsitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.obsitem:last-child{border-bottom:0}
.obsitem .oi{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center}
.obsitem .ot{font-size:11px;font-weight:700;color:var(--ink-3)}
.obsitem p{margin:3px 0 0;font-size:13.5px}
.obsitem .who{font-size:11.5px;color:var(--ink-3)}

/* ai note / SBAR */
.sbar{border-left:3px solid var(--primary);background:var(--surface-2);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:4px 0}
.sbar-row{padding:12px 16px;border-bottom:1px solid var(--line)}
.sbar-row:last-child{border-bottom:0}
.sbar-row .sl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-deep);margin-bottom:4px}
.sbar-row p{margin:0;font-size:13.5px;line-height:1.6}
.typing::after{content:"▍";color:var(--primary);animation:bl 1s step-end infinite}
@keyframes bl{50%{opacity:0}}

/* coordination */
.coord-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.coord-item:last-child{border-bottom:0}
.coord-item .ci{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.coord-item .ct{font-weight:600;font-size:14px}
.coord-item .cs{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.coord-item .cx{margin-left:auto;text-align:right;flex:none}

.msg{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5}
.bubble.them{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.us{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.bubble .b-who{font-size:10.5px;font-weight:700;opacity:.8;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}

.callout{display:flex;gap:11px;align-items:flex-start;background:var(--primary-soft);border-radius:var(--r-sm);padding:13px 15px;font-size:13.5px}
.callout .cai{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.callout b{color:var(--primary-deep)}

.howto{display:flex;flex-direction:column;gap:12px}
.step-card{display:flex;gap:13px}
.step-card .sn{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary-deep);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.step-card b{font-size:14px}
.step-card p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}

.hr{height:1px;background:var(--line);border:0;margin:16px 0}
.muted{color:var(--ink-3);font-size:12.5px}
.foot{text-align:center;color:var(--ink-3);font-size:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.foot b{color:var(--ink-2)}

.banner{background:linear-gradient(120deg,var(--primary-deep),var(--primary));color:#fff;border-radius:var(--r);
  padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-lg);flex-wrap:wrap}
.banner .bi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.banner h3{color:#fff;font-size:18px}
.banner p{margin:3px 0 0;font-size:13.5px;opacity:.9;max-width:52ch}
.banner .btn{margin-left:auto;background:#fff;color:var(--primary-deep);border-color:#fff}
@media(max-width:620px){.banner .btn{margin-left:0;width:100%}}

.clin-only,.care-only{display:none}
body[data-persona="clinician"] .clin-only{display:block}
body[data-persona="caregiver"] .care-only{display:block}
.persona-note{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);background:var(--surface-2);
  border:1px dashed var(--line);border-radius:8px;padding:5px 11px;margin-bottom:14px}
</style>

<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10c0-3 2-5 5-5 2 0 3 1 3 1s1-1 3-1c3 0 5 2 5 5 0 5-8 9-8 9"/><path d="M3 13h4l1.5-3 2 6 1.5-3H16"/>
        </svg>
      </div>
      <div><b>CareBridge</b><span>Recovery, bridged</span></div>
    </div>
    <div class="appbar-spacer"></div>
    <div class="persona" role="group" aria-label="View as">
      <button id="pCare" aria-pressed="true" onclick="setPersona('caregiver')">Caregiver</button>
      <button id="pClin" aria-pressed="false" onclick="setPersona('clinician')">Clinician</button>
    </div>
    <div class="pchip" title="Active recovery episode">
      <span class="avatar">EW</span>
      <span><b>Eleanor W.</b> · <span class="day">Day 5</span> of 30</span>
    </div>
    <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light / dark">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

  <div class="grid g2" style="margin-top:16px">

        ${OBS.map(o=>`<div class="obsitem">
          <span class="oi p-${o.sev==='crit'?'crit':o.sev==='warn'?'warn':'good'}" style="color:inherit">${svg(I[o.icon]||I.spark,2)}</span>

      <button class="btn accent" id="analyzeBtn" onclick="runAnalyze()">${svg(I.bolt,2)} Analyze trends for concerns</button>
      <div class="proc" id="analyzeProc" style="margin-top:14px"><span class="spin"></span><span id="analyzeTxt">Correlating wearable + observations…</span></div>
      <div class="extract-out" id="analyzeOut" style="margin-top:14px">
        <div class="alert crit" style="margin-bottom:12px"><span class="ai">${svg(I.warn,2.2)}</span>
          <div><h4>Escalate — possible surgical-site infection</h4>
          <p>New peri-incisional redness &amp; warmth + "throbbing" pain + a 74% mobility drop + fragmented sleep together exceed CareBridge's escalation threshold for post-op Day 5.</p></div></div>
        <ul style="margin:0 0 14px;padding-left:18px;font-size:13.5px;color:var(--ink-2);line-height:1.7">
          <li>Matches <b>"rising incision redness"</b> return-precaution from the discharge summary.</li>

          ${[["Day 5 steps vs. target","110 / 470","s-crit"],["Night awakenings","7 (▲ from 2)","s-warn"],["Incision","New redness + warmth","s-crit"],["Pain","“Throbbing”, guarded","s-warn"],["Temperature","Not yet checked","s-warn"],["Plan adherence","60% today","s-good"]]
            .map(([k,v,c])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--line)"><span class="muted">${k}</span><b class="${c} mono" style="font-size:12.5px">${v}</b></div>`).join('')}
        </div>

const SBAR=[
  ["Situation","Eleanor Whitfield, 82 F, post-op Day 5 after right total hip replacement (10/31), home with aide. New localized incision redness and warmth with throbbing pain, flagged by caregiver and corroborated by a declining mobility trend."],
  ["Background","Posterior hip precautions in place. Meds: apixaban, scheduled acetaminophen, PRN oxycodone. Metformin held pending PCP reconciliation. No fever documented. Discharge return-precautions include rising incision redness and uncontrolled pain."],
  ["Assessment","Signals consistent with possible early surgical-site infection: new peri-incisional erythema + warmth, pain on weight-bearing, steps down 74% since Day 3 (110 vs. 470 target), and sleep fragmentation (7 awakenings). Temperature not yet obtained."],
  ["Recommendation","Nurse review within the hour. Obtain temperature now; photo-document incision. Consider same-day telehealth or in-person wound assessment. Hold advancement of rehab intensity until cleared. Caregiver advised to watch for fever, spreading redness, or drainage."]
];

/* ============================= INTERACTIONS ============================= */
function toggleChk(id){
  const c=CHECKLIST.find(x=>x.id===id); c.done=!c.done;
  const el=document.getElementById('k-'+id);
  el.classList.toggle('done',c.done);
  el.querySelector('.chk').setAttribute('aria-checked',c.done);
  const done=CHECKLIST.filter(x=>x.done).length, pct=Math.round(done/CHECKLIST.length*100);
  document.getElementById('chkBar').style.width=pct+'%';
  document.getElementById('chkCount').textContent=done;
}

function procRun(btnId,procId,txtId,outId,steps,done){
  const btn=document.getElementById(btnId), proc=document.getElementById(procId), txt=document.getElementById(txtId);
  btn.disabled=true; proc.classList.add('on'); let i=0; txt.textContent=steps[0];
  const iv=setInterval(()=>{i++; if(i<steps.length){txt.textContent=steps[i];} else {clearInterval(iv); proc.classList.remove('on'); btn.style.display='none'; document.getElementById(outId).classList.add('on'); done&&done();}},620);
}
function runExtract(){
  procRun('extractBtn','extractProc','procTxt','extractOut',
    ["Reading discharge summary…","Extracting medications & doses…","Mapping rehab and precautions…","Building Day-5 checklist…"],
    ()=>{document.getElementById('medCard').style.display='block';});
}
function runAnalyze(){
  procRun('analyzeBtn','analyzeProc','analyzeTxt','analyzeOut',
    ["Correlating wearable + observations…","Comparing to expected recovery curve…","Scoring escalation threshold…"]);
}
function runSbar(){
  procRun('sbarBtn','sbarProc','sbarTxt','sbarOut',
    ["Assembling clinical record…","Structuring S-B-A-R…","Attaching evidence trail…"],
    typeSbar);
}
function typeSbar(){
  const box=document.getElementById('sbarBox'); box.innerHTML='';
  let r=0;
  (function nextRow(){
    if(r>=SBAR.length) return;
    const [label,text]=SBAR[r];
    const row=document.createElement('div'); row.className='sbar-row';
    row.innerHTML=`<div class="sl">${label}</div><p class="typing"></p>`;
    box.appendChild(row);
    const p=row.querySelector('p'); let c=0;
    const iv=setInterval(()=>{
      c+=2; p.textContent=text.slice(0,c);
      if(c>=text.length){clearInterval(iv); p.classList.remove('typing'); r++; setTimeout(nextRow,120);}
    },12);
  })();
}

/* ============================= CHARTS ============================= */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawCharts(){ drawSteps(); drawSleep(); drawRing(); }

function drawSteps(){
  const el=document.getElementById('chartSteps'); if(!el)return;
  const W=440,H=210,pL=34,pR=14,pT=14,pB=28, max=500;
  const x=i=>pL+(W-pL-pR)*i/(DAYS.length-1);
  const y=v=>pT+(H-pT-pB)*(1-v/max);
  const warn=css('--warn'),crit=css('--crit'),line=css('--line'),ink3=css('--ink-3'),surf=css('--surface');
  // actual color shifts to crit on last point
  let grid=''; [0,125,250,375,500].forEach(v=>{grid+=`<line x1="${pL}" y1="${y(v)}" x2="${W-pR}" y2="${y(v)}" stroke="${line}" stroke-width="1"/><text x="${pL-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="${ink3}" font-family="IBM Plex Mono">${v}</text>`});
  const tgtPts=STEPS_TARGET.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const actPts=STEPS.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const area=`${pL},${y(0)} ${actPts} ${x(DAYS.length-1)},${y(0)}`;
  let dots=STEPS.map((v,i)=>{const c=v<STEPS_TARGET[i]*.55?crit:warn;return `<circle cx="${x(i)}" cy="${y(v)}" r="${i===STEPS.length-1?5:3.5}" fill="${c}" stroke="${surf}" stroke-width="2"/>`}).join('');
  let labels=DAYS.map((d,i)=>`<text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="10" fill="${ink3}" font-family="Public Sans">${d}</text>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily steps actual versus target">
    <defs><linearGradient id="gSteps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${warn}" stop-opacity=".28"/><stop offset="1" stop-color="${warn}" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <polyline points="${tgtPts}" fill="none" stroke="${ink3}" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="${area}" fill="url(#gSteps)"/>
    <polyline points="${actPts}" fill="none" stroke="${warn}" stroke-width="2.5"/>
    ${dots}
    <text x="${x(STEPS.length-1)}" y="${y(STEPS[STEPS.length-1])-11}" text-anchor="end" font-size="11" font-weight="700" fill="${crit}" font-family="IBM Plex Mono">110</text>
    ${labels}
  </svg>`;
}

function drawSleep(){
  const el=document.getElementById('chartSleep'); if(!el)return;
  const W=440,H=150,pL=26,pR=12,pT=12,pB=26,max=8;
  const n=AWAKE.length, bw=(W-pL-pR)/n*0.56;
  const x=i=>pL+(W-pL-pR)*(i+0.5)/n;
  const y=v=>pT+(H-pT-pB)*(1-v/max);
  const warn=css('--warn'),crit=css('--crit'),prim=css('--primary'),ink3=css('--ink-3'),line=css('--line');
  let grid=''; [0,4,8].forEach(v=>{grid+=`<line x1="${pL}" y1="${y(v)}" x2="${W-pR}" y2="${y(v)}" stroke="${line}" stroke-width="1"/><text x="${pL-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="${ink3}" font-family="IBM Plex Mono">${v}</text>`});
  let bars=AWAKE.map((v,i)=>{const c=v>=5?crit:v>=3?warn:prim; const yy=y(v),h=y(0)-yy;
    return `<rect x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="4" fill="${c}"/><text x="${x(i)}" y="${yy-5}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}" font-family="IBM Plex Mono">${v}</text>`}).join('');
  let labels=DAYS.map((d,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="${ink3}" font-family="Public Sans">${d.replace('Day ','D')}</text>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Night awakenings per night">${grid}${bars}${labels}</svg>`;
}

function drawRing(){
  const el=document.getElementById('ring'); if(!el)return;
  const pct=UPRIGHT_TODAY/UPRIGHT_GOAL, r=52, c=2*Math.PI*r;
  const warn=css('--warn'),track=css('--surface-3');
  el.innerHTML=`<svg viewBox="0 0 118 118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="${track}" stroke-width="11"/>
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="${warn}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 59 59)"/></svg>
    <div class="rv"><div><b>${Math.round(pct*100)}%</b><small>of goal</small></div></div>`;
}

/* ============================= PERSONA / THEME ============================= */
function setPersona(p){
  document.body.dataset.persona=p;
  document.getElementById('pCare').setAttribute('aria-pressed',p==='caregiver');
  document.getElementById('pClin').setAttribute('aria-pressed',p==='clinician');
  try{localStorage.setItem('cb-persona',p)}catch(e){}
}
function setTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  const dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('themeIcon').innerHTML = dark
    ? '<path d="M20 14A8 8 0 118 2a6 6 0 0012 12z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  try{t?localStorage.setItem('cb-theme',t):localStorage.removeItem('cb-theme')}catch(e){}
  if(current==='monitor') drawCharts();
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme:dark)').matches;
  const now = cur ? cur : (sysDark?'dark':'light');
  setTheme(now==='dark'?'light':'dark');
}

/* ============================= BOOT ============================= */
(function init(){
  let p='caregiver',t=null;
  try{p=localStorage.getItem('cb-persona')||'caregiver';t=localStorage.getItem('cb-theme')}catch(e){}
  setPersona(p); setTheme(t);
  renderRail(); renderView();
  if(location.hash){const id=location.hash.slice(1); if(TABS.some(x=>x.id===id)){current=id;renderRail();renderView();}}
})();
function footer(){return `<div class="foot">CareBridge · AI-assisted home recovery · <b>Fictional demo data</b>. Not medical advice — every clinical decision is made by a licensed professional.</div>`}
</script>
